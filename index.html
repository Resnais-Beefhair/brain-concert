<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#030810" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2235%22 fill=%22%23e5fa9a%22/%3E%3C/svg%3E"
    />
    <title>Brain Concert — Inside the Signal</title>
    <meta
      name="description"
      content="Explore a fruit fly connectome through simulated neural activity and artistic sound: 138,639 neurons, entirely in your browser."
    />
    <style>
      html,
      body {
        margin: 0;
        background: #030810;
        color: #f6e9de;
        font-family: Arial, sans-serif;
      }
      #boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #boot h1 {
        font-size: clamp(32px, 7vw, 64px);
        letter-spacing: -0.04em;
      }
      #boot p {
        max-width: 560px;
        line-height: 1.7;
      }
      #boot:before {
        content: '✳';
        font-size: 48px;
        color: #e7fba2;
        animation: boot-pulse 2s infinite;
      }
      #boot.failed:before {
        animation: none;
      }
      #boot a {
        color: #e7fba2;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot:before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="boot">
        <h1>Brain Concert</h1>
        <p>
          138,639 neurons. An audiovisual work based on a fruit fly connectome.<br />Simulated
          neural activity · artistic sound.
        </p>
        <p id="boot-label" role="status">Opening the brain concert…</p>
        <p>If loading stalls, <a href="">reload the page</a>.</p>
        <noscript><p>Enable JavaScript to view this experience.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
